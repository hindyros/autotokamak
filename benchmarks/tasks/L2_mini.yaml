# MINI variant for pre-push verification: identical task/contract, scaled
# campaign (<=150 initial, up to 3x100 adaptive rounds, >=20 test solves,
# same 70% early stop). Generated from L2_library.yaml; keep numbers as the ONLY diff.
task_id: L2_mini
access_level: L2
problem: "TITLE\n  Build, end to end, a machine-learning surrogate for fixed-boundary\n\
  \  Grad-Shafranov tokamak equilibria \u2014 including a data-generation\n  campaign\
  \ with adaptive (active) sampling \u2014 using the installed\n  `autotokamak`\
  \ platform library wherever it helps.\n\nTHE TASK\n  TokaMaker, part of the pip-installed\
  \ `OpenFUSIONToolkit` Python\n  package, solves the Grad-Shafranov equation for\
  \ the poloidal flux\n  psi(R, Z) of a tokamak plasma. It is your ground-truth\
  \ physics\n  solver, and the installed `autotokamak` package already wraps it.\n\
  \n  Consider fixed-boundary equilibria of D-shaped plasmas described by\n  5 input\
  \ parameters, with TokaMaker's default pressure/current\n  profile shapes:\n\n\
  \    r0    : major radius        [m]   in [0.35, 0.55]\n    a     : minor radius\
  \        [m]   in [0.10, 0.20]\n    kappa : elongation          [-]   in [1.0,\
  \ 1.6]\n    delta : triangularity       [-]   in [0.0, 0.4]\n    Ip    : plasma\
  \ current      [A]   in [80e3, 200e3]\n    (plasma centered at z0 = 0)\n\n  Your\
  \ job, in full:\n    1. Drive the solver for fixed-boundary solves. You may use\n\
  \       `autotokamak.data.sweep.run_sweep` (config-driven sweeps; also\n     \
  \  accepts an explicit (N, 5) sample matrix), or go through\n       `autotokamak.core`\
  \ directly. A single solve should take\n       seconds, not minutes.\n    2. Design\
  \ and run a DATA-GENERATION CAMPAIGN structured as an\n       initial space-filling\
  \ design of AT MOST 150 solves followed by UP TO 3 ADAPTIVE\n       (ACTIVE-SAMPLING)\
  \ ROUNDS of EXACTLY 100 new solver runs each\n       (failed/unconverged solves\
  \ count against a round's 100).\n       A one-shot space-filling or random design\
  \ alone is NOT\n       sufficient: each round's 500 new solver evaluations must\
  \ be\n       chosen ADAPTIVELY, informed by the current model or data\n      \
  \ (`autotokamak.data.acquire` implements residual-UCB and PCA-GP\n       variance\
  \ acquisition you may reuse, or bring your own).\n       STOPPING CRITERION: keep\
  \ a held-out VALIDATION set (separate\n       from the final test set of step\
  \ 4, which must never influence\n       the campaign); after each round, retrain\
  \ your surrogate and\n       stop the campaign early once its validation error\
  \ is reduced\n       by at least 70% relative to the mean-predictor baseline (a\n\
  \       model that always predicts the training-set mean psi map),\n       i.e.\
  \ val_error <= 0.30 * baseline_error. Otherwise continue to\n       the 10-round\
  \ cap. Log every acquisition decision (which point,\n       when, why) and each\
  \ round's validation error vs baseline to an\n       acquisition log file.\n \
  \   3. Train an ML surrogate mapping the 5 parameters to the PHYSICAL\n      \
  \ poloidal flux psi(R, Z) in Webers (not a normalized flux).\n       `autotokamak.surrogate`\
  \ provides dataset loading, PCA\n       reduction, a model zoo (GP, kernel ridge,\
  \ polynomial ridge,\n       MLP), and Optuna search; model family and representation\n\
  \       remain entirely your choice.\n    4. Evaluate honestly on a held-out test\
  \ set of AT LEAST 20 solver\n       runs at uniformly random parameters (fixed\
  \ recorded seed),\n       generated independently and never used for training,\
  \ model\n       selection, or acquisition.\n    5. Report results and analyze\
  \ whether your adaptive sampling\n       actually helped (e.g. versus the model\
  \ trained on the initial\n       design only, or any comparison you can defend).\n\
  \nEVALUATION INTERFACE (fixed, so results are comparable across methods)\n  Predictions\
  \ and metrics are defined on this fixed rectangular grid:\n    R : 64 points,\
  \ uniform in [0.15, 0.80] m\n    Z : 96 points, uniform in [-0.40, 0.40] m\n \
  \ psi arrays are shaped (96, 64) = (nZ, nR). Grid points outside the\n  plasma\
  \ boundary carry NaN; all metrics are computed only where the\n  ground truth\
  \ is finite.\n\n  Required metric: per-sample relative L2 error\n    err_i = ||psi_pred_i\
  \ - psi_true_i||_2 / ||psi_true_i||_2\n  over the finite grid points. Report mean,\
  \ median, and 90th\n  percentile over the test set, and the same numbers for a\
  \ trivial\n  baseline (predict the training-set mean psi) so the surrogate's\n\
  \  value is evident.\n\nDELIVERABLES (all in your current working directory; internal\
  \ file\nformats and code organization are your choice)\n  1. Your pipeline code,\
  \ runnable end to end by one documented entry\n     command.\n  2. The dataset(s)\
  \ you generated, plus the acquisition log.\n  3. The trained model artifact, plus\
  \ a prediction script with EXACTLY\n     this interface:\n       python predict.py\
  \ --input params.json --output pred.npz\n     where params.json is a JSON list\
  \ of objects with keys\n     r0, a, kappa, delta, Ip, and pred.npz contains:\n\
  \       psi : (N, 96, 64) float64   predicted flux [Wb], NaN outside plasma\n\
  \       R   : (64,) float64         grid R coordinates [m]\n       Z   : (96,)\
  \ float64         grid Z coordinates [m]\n  4. report.json \u2014 machine-readable\
  \ summary with at least:\n       n_solves_attempted, n_solves_succeeded, n_train,\
  \ n_test,\n       sampling_strategy (short text), acquisition_log (path),\n  \
  \     metrics: {test_rel_l2: {mean, median, p90},\n                 baseline_rel_l2:\
  \ {mean, median, p90}},\n       adaptive_vs_initial (your evidence that adaptivity\
  \ helped,\n       or an honest statement that it did not).\n  5. README.md \u2014\
  \ your design, why you chose it, how to run, results.\n\n  You MUST actually run\
  \ the full campaign and training within this\n  session and verify every deliverable\
  \ exists before declaring done.\n  Report failures honestly in report.json/README;\
  \ do not fabricate\n  metrics.\n\nENVIRONMENT FACTS\n  * Your current working\
  \ directory IS your workspace. Create all files\n    here.\n  * `python` resolves\
  \ to a Python 3.11 venv that already has:\n    numpy, scipy, h5py, matplotlib,\
  \ pyyaml, scikit-learn, torch,\n    optuna, OpenFUSIONToolkit, and the `autotokamak`\
  \ platform library\n    (importable; using it is ALLOWED and RECOMMENDED \u2014\
  \ that is the\n    point of this condition). Nothing may be installed.\n  * Useful\
  \ autotokamak entry points: `autotokamak.data.sweep.run_sweep`\n    (sweep or\
  \ explicit-matrix solves \u2192 HDF5),\n    `autotokamak.data.acquire` (acquisition\
  \ strategies),\n    `autotokamak.surrogate.dataset/reduce/zoo/optuna_search/automl_loop`\n\
  \    (loading, PCA, model factories, search). Read their docstrings.\n  * TokaMaker\
  \ limitation: only ONE `OFT_env` may ever be created per\n    Python process.\
  \ `autotokamak.core.solver.make_solver` handles\n    reuse via its `env=` argument;\
  \ if you bypass autotokamak, create\n    the environment object once and reuse\
  \ it, or run solves in child\n    processes.\n\nCONSTRAINTS\n  * PILOT GATE (mandatory):\
  \ before the campaign, run a pilot of at\n    least 20 solves at random parameters.\
  \ If the success rate is\n    below 50%, STOP, diagnose the per-failure error\
  \ messages, fix,\n    and re-run the pilot. Never start the 500-solve rounds while\
  \ the\n    pilot is failing.\n  * Do not run `pip install` or modify the environment.\n\
  \  * Do not call `git`.\n  * Do not prompt for user input; the task is fully autonomous.\n\
  \  * Do not modify the installed autotokamak/OpenFUSIONToolkit\n    packages;\
  \ use them as libraries.\n  * If errors arise, debug, fix your code, and re-run.\
  \ Stay within\n    the campaign structure above (at most 3 adaptive rounds x 100\n\
  \    solves, plus the initial design and validation/test sets) across\n    ALL\
  \ attempts that reach the solver.\n"
expected_artifacts:
- report.json
- predict.py
- README.md
